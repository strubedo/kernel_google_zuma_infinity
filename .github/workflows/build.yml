name: Build Kernel

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        
      target:
        required: true
        type: string

      variant:
        required: true
        type: string

jobs:
  build:
    name: "${{ inputs.branch }} • ${{ inputs.target }} • ${{ inputs.variant }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      TARGET: ${{ inputs.target }}
      VARIANT: ${{ inputs.variant }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }} 
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            gh \
            jq \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.target }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.target }}
            ccache-${{ runner.os }}

      - name: Restore toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: toolchains
          key: toolchain-gcc-14.2.0-nolibc-aarch64-linux-53deb48c660f1453ca79fa224d44de1145c8c5377d90040934af063d1b726b29

      - name: Fetch toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          URL="https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.xz"
          SHA256="53deb48c660f1453ca79fa224d44de1145c8c5377d90040934af063d1b726b29"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o toolchain.tar.xz \
            "$URL"

          echo "${SHA256}  toolchain.tar.xz" | sha256sum -c -

          mkdir -p toolchains
          tar -xJf toolchain.tar.xz -C toolchains
          rm toolchain.tar.xz

      - name: Prepare scripts
        run: chmod +x scripts/*.sh

      - name: Patch source tree
        run: |
          ./gscripts/patch_sultan.sh "$TARGET" "$VARIANT"

      - name: Build kernel
        run: |
          ./gscripts/build.sh "$TARGET"

      - name: Package AnyKernel
        run: |
          ./gscripts/package.sh "$TARGET" "$VARIANT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan_${{ inputs.branch }}_${{ inputs.target }}_${{ inputs.variant }}
          path: AnyKernel/*
          if-no-files-found: error
          compression-level: 0
